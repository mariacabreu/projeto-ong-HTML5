<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Esperança - Cadastro</title>
</head>
<body>
    <header>
        <h1>Faça Parte</h1>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastre-se</a>
        </nav>
    </header>

    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required autocomplete="name">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required autocomplete="email">

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf"
                       inputmode="numeric"
                       pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                       placeholder="000.000.000-00"
                       title="Digite o CPF no formato 000.000.000-00"
                       required>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep"
                       inputmode="numeric"
                       pattern="[0-9]{5}-[0-9]{3}"
                       placeholder="00000-000"
                       title="Digite o CEP no formato 00000-000"
                       required>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required autocomplete="street-address">

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required autocomplete="address-level2">

                <label for="estado">Estado:</label>
                <select id="estado" name="estado" required autocomplete="address-level1">
                    <option value="">Selecione</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Contato</legend>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone"
                       inputmode="tel"
                       pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                       placeholder="(00) 00000-0000"
                       title="Digite o telefone no formato (00) 00000-0000"
                       required autocomplete="tel">
            </fieldset>

            <button type="submit">Enviar cadastro</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ONG Esperança. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
